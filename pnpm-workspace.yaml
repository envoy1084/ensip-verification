minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@effect/*"
  - "effect"
  - "klarity"
blockExoticSubdeps: true
packages:
  - "apps/*"
allowBuilds:
  bufferutil: false
  es5-ext: true
  esbuild: true
  keccak: false
  lefthook: true
  msgpackr-extract: true
  utf-8-validate: false
  vue-demi: true
catalog:
  "@commitlint/cli": "21.0.1"
  "@commitlint/config-conventional": "21.0.1"
  "lefthook": "2.1.9"
  "oxfmt": "0.56.0"
  "oxlint": "1.71.0"
  "react": "19.2.7"
  "react-dom": "19.2.7"
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  "typescript": "6.0.3"
  "turbo": "2.10.4"
  "@types/node": "26.0.1"
  "vite": "8.1.4"
